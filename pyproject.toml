[project]
name = "bacon-bacnet"
dynamic = ["version"]
description = "BACon: BACnet, on site. Scan a BACnet/IP network, read every property, trend points and export to Excel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "bacpypes3>=0.0.110",
    "fastapi",
    "uvicorn",
    "openpyxl",
    "psutil",
    "pywebview>=5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
bacon = "bacon.server:main"

[project.urls]
Homepage = "https://github.com/TheeHappyCoder/BACon"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "bacon.version.__version__" }

[tool.setuptools.package-data]
bacon = ["data/*", "web/**/*"]

[project]
name = "rasher-bacnet"
dynamic = ["version"]
description = "Rasher: a simulated BACnet/IP room controller with a face, for testing BMS and scanner tools."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "bacpypes3>=0.0.110",
    "fastapi",
    "uvicorn",
    "psutil",
    "pywebview>=5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
rasher = "rasher.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "rasher.version.__version__" }

[tool.setuptools.package-data]
rasher = ["web/**/*"]
